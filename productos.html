<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos · Repostería Gustocci</title>
<meta name="description" content="Catálogo de tortas, queques, cupcakes, galletas decoradas y especialidades de Repostería Gustocci en Oruro. Precios en bolivianos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="js/main.js" defer></script>

<body data-page="productos">
<div id="cab"></div>

    <div class="wrap">

      </div>
      <p id="cuenta" style="color:var(--suave);margin-bottom:16px" aria-live="polite"></p>
      <div class="grid" id="catalogo"></div>
    </div>
  </section>

<div id="pie"></div>
